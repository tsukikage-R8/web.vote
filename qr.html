<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>QR一括生成</title>
<style>
body{
font-family:sans-serif;
background:#0b1026;
color:white;
text-align:center;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:12px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:12px;
}

img{
width:120px;
height:120px;
}
</style>
</head>

<body>

<h1>QRコード一括生成</h1>
<p>クラス別QR一覧</p>

<div class="grid" id="grid"></div>

<script>

const classBase =
"https://tsukikage-r8.github.io/web.vote/confirm.html?type=class&choice=";

const clubBase =
"https://tsukikage-r8.github.io/web.vote/confirm.html?type=club&choice=";


/* クラス */
const classes = [
"１年キャリア探究コース：ステンドグラス風アート",
"1年進学：星彩ワンダーランド",
"2J1：トトロの世界",
"2J2：『呪われた２年J２組』〜正道館の最後の教室〜",
"2J3：縁日",
"2J4：占いお化け屋敷",
"2S：トイストーリーマニア",
"2K：人生はギャンブル",
"3J1：フォトスポット",
"3J2：お化け屋敷",
"3J3：※立入禁止　帰れぬ教室。",
"3J4：トイストーリーマニア",
"3J5：創作の世界",
"3J6：VS樹徳",
"3S1：party night！",
"3S2：ゾンビ気配斬りサバイバル",
"3K：Game Circus",
"2SS・3SS：SSカジノ"
];

/* 部活動 */
const clubs = [
"コーラス部：月影コンサート",
"茶道部：生徒によるお茶席",
"華道部：青春を生ける",
"1年キャリア探究：ステンドグラス風アート",
"ダンス部：ダンス部発表会",
"慈善バザー：慈善バザー",
"写真部：JUTOKU GALLERY",
"理科部：サイエンスラボ",
"あかしや委員：活動紹介",
"家庭科部：アクアビーズワークショップ",
"eスポーツ部：ｅスポーツをやろう！",
"美術部・書道部：美術・書道の作品展！",
"書道部：自らの好きな語句、文字を揮毫",
"文芸部：創作の世界　～ミテイッテネ～",
"英会話部：English Games Festival",
"インターアクトクラブ：SDGs virtual CAFE"
];

const grid = document.getElementById("grid");


function createQRCard(name, url){

const qr =
"https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="
+ encodeURIComponent(url);

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<p>${name}</p>
<img src="${qr}">
`;

grid.appendChild(div);
}


/* クラスQR */
classes.forEach(c=>{
createQRCard(
c,
classBase + encodeURIComponent(c)
);
});


/* 部活動QR */
clubs.forEach(c=>{
createQRCard(
c,
clubBase + encodeURIComponent(c)
);
});

</script>

</body>
</html>
